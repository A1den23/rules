
proxy-providers:
  FlowerCloud:
    url: "你的订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: Direct

# 节点信息
proxies:
  - {name: Direct, type: direct, udp: true}

# 全局配置 
mixed-port: 7890
authentication:
  - "user:passwd"
skip-auth-prefixes:
  - 127.0.0.0/8
  - 192.168.0.0/16
  - 10.0.0.0/16

allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
ntp:
  enable: true
  write-to-system: true

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  mtu: 1400
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc

  fake-ip-filter:
    - "rule-set:fakeipfilter_cn"
    - "rule-set:fakeipfilter_!cn"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:apple_cn_domain"
    - "rule-set:steam_cn_domain"
    - "rule-set:microsoft_cn_domain"

  default-nameserver:
    - https://223.5.5.5/dns-query

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steam_cn_domain,microsoft_cn_domain,apple_cn_domain":
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
      - https://1.1.1.1/dns-query#🚀 Proxies&disable-qtype-65=true
      - https://8.8.8.8/dns-query#🚀 Proxies&disable-qtype-65=true

  nameserver:
    - https://8.8.8.8/dns-query#🚀 Proxies&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#🚀 Proxies
  fallback-filter:
    geoip: true
    geoip-code: CN
  direct-nameserver-follow-policy: true

pr: &select {type: select, proxies: [🚀 Proxies, 🎯 Direct], include-all: true}
proxy-groups:
  - {name: 🚀 Proxies, type: select, proxies: [🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true}
  - {name: Binance, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Binance.png"}
  - {name: Crypto, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Crypto.png"}
  - {name: Telegram, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Telegram.png"}
  - {name: YouTube, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/YouTube.png"}
  - {name: AI, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/AI.png"}
  - {name: Apple, type: select, proxies: [🎯 Direct, 🚀 Proxies], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Apple.png"}
  - {name: Steam, type: select, proxies: [🚀 Proxies, 🎯 Direct], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Steam.png"}
  - {name: Spotify, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Spotify.png"}
  - {name: Bilibili, type: select, proxies: [🎯 Direct, 🇨🇳 Taiwan], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Bilibili.png"}
  - {name: 🎞️ PikPak, << : *select}
  - {name: CEX, type: select, proxies: [🚀 Proxies, 🇭🇰 HongKong, 🇸🇬 Singapore, 🇯🇵 Japan, 🇨🇳 Taiwan, 🇺🇲 UnitedStates], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Bitcoin.png"}
  - {name: 🎯 Direct, type: select, proxies: [Direct, 🚀 Proxies]}
  - {name: 🐟 Others, type: select, proxies: [🚀 Proxies, 🎯 Direct]}
  - {name: 🇭🇰 HongKong, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(港|HK|香港|(?i)Hong))^((?!(台|日|韩|新|美)).)*$"}
  - {name: 🇸🇬 Singapore, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(新加坡|SG|坡|狮城|Singapore))^((?!(港|台|韩|日|美)).)*$" }
  - {name: 🇯🇵 Japan, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(日|日本|JP|(?i)Japan))^((?!(港|台|韩|新|美|尼)).)*$" }
  - {name: 🇨🇳 Taiwan, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(台|台湾|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🇺🇲 UnitedStates, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(美|美国|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}

# 规则匹配
rules:
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET, myRules,🚀 Proxies
  - RULE-SET, private_domain,🎯 Direct
  - RULE-SET, private_ip,🎯 Direct,no-resolve
  - RULE-SET, binance,Binance
  - RULE-SET, bybit_domain,Binance
  - RULE-SET, crypto,Crypto
  - RULE-SET, kraken_domain,CEX
  - RULE-SET, ibkr_domain,CEX
  - RULE-SET, cex,CEX
  - RULE-SET, apple_cn_domain,🎯 Direct
  - RULE-SET, apple_domain,Apple
  - RULE-SET, steam_cn_domain,🎯 Direct
  - RULE-SET, steam_domain,Steam
  - RULE-SET, youtube_domain,YouTube
  - RULE-SET, spotify_domain,Spotify
  - RULE-SET, telegram_domain,Telegram
  - RULE-SET, ai,AI
  - RULE-SET, openai_domain,AI 
  - RULE-SET, bilibili_domain,Bilibili
  - RULE-SET, bilibili_intl_domain,Bilibili
  - RULE-SET, pikpak_domain,🎞️ PikPak
  - RULE-SET, microsoft_cn_domain,🎯 Direct
  - RULE-SET, microsoft_domain,🚀 Proxies
  - RULE-SET, game,🚀 Proxies
  - RULE-SET, google_ip,🚀 Proxies
  - RULE-SET, telegram_ip,Telegram
  - RULE-SET, gfw_domain,🚀 Proxies
  - RULE-SET, cn!_domain,🚀 Proxies
  - IP-CIDR, 43.128.250.83/32,🎯 Direct,no-resolve
  - IP-CIDR, 43.155.250.47/32,🎯 Direct,no-resolve
  - RULE-SET, cn_domain,🎯 Direct
  - RULE-SET, cn_ip,🎯 Direct
  - MATCH,🐟 Others
  
# 规则集
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

